[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-backtest"
version = "0.1.0"
description = "Offline trend-timing backtest demonstration using synthetic data"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4"]

[project.scripts]
trend-demo = "trend_timing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trend_timing = ["sample.csv"]
